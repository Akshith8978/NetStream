# ==============================================================================
# NetStream Server Configuration File
# ==============================================================================

# Listening host IP address (0.0.0.0 for all interfaces)
host = 0.0.0.0

# Listening TCP port
port = 8080

# Number of worker threads for task processing
worker_threads = 4

# Maximum capacity of bounded thread pool task queue
queue_capacity = 1024

# Maximum permitted frame payload size in bytes (default 16MB)
max_message_size = 16777216

# Listen socket connection backlog
backlog = 128

# Verbose logging (true/false)
verbose = false
